<title>からだ週報</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Murecho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: 診療記録の台帳のように、上から「今週の4指標 → 週次推移 → 今週のレポート本文 → 過去の号・フィードバック」と要約から詳細へ降りる1カラム */
:root {
  --paper: #f4f7f5;
  --surface: #ffffff;
  --ink: #1c2622;
  --muted: #5a6862;
  --line: #dbe3de;
  --accent: #2e6a56;
  --band: rgba(46, 106, 86, 0.12);
  --good: #2b7a4b;
  --warn: #9c620f;
  --bad: #ad3636;
  --good-bg: rgba(43, 122, 75, 0.12);
  --warn-bg: rgba(156, 98, 15, 0.13);
  --bad-bg: rgba(173, 54, 54, 0.12);
  --font-display: "Murecho", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #111815;
    --surface: #18211d;
    --ink: #e3ebe6;
    --muted: #9aa9a1;
    --line: #2b3832;
    --accent: #7cc0a4;
    --band: rgba(124, 192, 164, 0.14);
    --good: #6cc38e;
    --warn: #e2a94c;
    --bad: #ec8080;
    --good-bg: rgba(108, 195, 142, 0.15);
    --warn-bg: rgba(226, 169, 76, 0.15);
    --bad-bg: rgba(236, 128, 128, 0.15);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #111815;
  --surface: #18211d;
  --ink: #e3ebe6;
  --muted: #9aa9a1;
  --line: #2b3832;
  --accent: #7cc0a4;
  --band: rgba(124, 192, 164, 0.14);
  --good: #6cc38e;
  --warn: #e2a94c;
  --bad: #ec8080;
  --good-bg: rgba(108, 195, 142, 0.15);
  --warn-bg: rgba(226, 169, 76, 0.15);
  --bad-bg: rgba(236, 128, 128, 0.15);
}

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.75;
}
.wrap {
  max-width: 1040px;
  margin: 0 auto;
  padding-block: 32px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 40px;
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.35; margin: 0; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.label {
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--muted);
  font-weight: 500;
}

/* 見出し部 */
.masthead { display: grid; gap: 6px; border-bottom: 2px solid var(--ink); padding-bottom: 16px; }
.masthead h1 { font-size: 34px; font-weight: 800; letter-spacing: 0.04em; }
.masthead .period { font-size: 17px; font-weight: 500; }
.masthead .meta { font-size: 13px; color: var(--muted); }

/* 今週の4指標 */
.section { display: grid; gap: 16px; }
.section > h2 { font-size: 20px; font-weight: 800; }
.section > .lead { margin: 0; color: var(--muted); font-size: 14px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.kpi {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 16px;
  display: grid;
  gap: 8px;
  align-content: start;
}
.kpi .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.kpi .value { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 600; line-height: 1.1; }
.kpi .value small { font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 4px; }
.kpi .target { font-size: 13px; color: var(--muted); }
.kpi .delta { font-size: 13px; }
.chip {
  font-size: 12px;
  font-weight: 700;
  padding: 1px 8px;
  border-radius: 999px;
  white-space: nowrap;
}
.chip.good { color: var(--good); background: var(--good-bg); }
.chip.warn { color: var(--warn); background: var(--warn-bg); }
.chip.bad { color: var(--bad); background: var(--bad-bg); }
.pfc-rows { display: grid; gap: 4px; font-size: 13px; }
.pfc-row { display: grid; grid-template-columns: 4.5em 1fr auto; gap: 8px; align-items: center; }
.pfc-row .bar { height: 6px; background: var(--line); border-radius: 3px; position: relative; overflow: hidden; }
.pfc-row .bar span { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; }

/* 週次推移 */
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 12px 6px; display: grid; gap: 4px; }
.chart h3 { font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.chart h3 .label { font-family: var(--font-body); }
.chart svg { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .band { fill: var(--band); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; }
.chart .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; }
.chart .dot.last { fill: var(--accent); }
.chart text { fill: var(--muted); font-family: var(--font-data); font-size: 10px; }
.chart text.endval { fill: var(--ink); font-weight: 600; font-size: 11px; }

/* 表（推移表・レポート本文の表） */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-weight: 700; color: var(--muted); font-size: 12.5px; letter-spacing: 0.04em; white-space: nowrap; background: var(--paper); }
tr:last-child td { border-bottom: 0; }
.trend-table td.n { font-family: var(--font-data); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.trend-table th.n { text-align: right; }
.trend-table tr.current td { font-weight: 700; }

/* レポート本文 */
.report { display: grid; gap: 16px; }
.report > h2 { font-size: 20px; font-weight: 800; padding-top: 12px; border-top: 1px solid var(--line); }
.report > h3 { font-size: 16px; font-weight: 700; }
.report > p, .report > ul { margin: 0; }
.report > ul { padding-left: 1.2em; display: grid; gap: 6px; }
.report hr { border: 0; border-top: 1px solid var(--line); margin: 0; width: 100%; }
.report a { color: var(--accent); }
.report a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.report strong { font-weight: 700; }
.report code { font-family: var(--font-data); font-size: 0.9em; }

/* 号のナビゲーション・過去のレポート */
.issue-nav { font-size: 13px; }
.issue-nav a, .archive a { color: var(--accent); }
.issue-nav a:focus-visible, .archive a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.archive { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.archive li { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; display: grid; gap: 2px; }
.archive li.current { border-color: var(--accent); }
.archive .issue { font-family: var(--font-display); font-weight: 600; font-size: 15px; }
.archive .span { font-size: 12.5px; color: var(--muted); }

/* フィードバック履歴 */
.feedback { display: grid; gap: 8px; }
.fb { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; }
.fb summary { cursor: pointer; display: flex; gap: 12px; align-items: baseline; font-size: 14px; }
.fb summary .num { color: var(--muted); font-size: 13px; flex: none; }
.fb summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.fb dl { margin: 10px 0 2px; display: grid; grid-template-columns: 3em 1fr; gap: 6px 12px; font-size: 13.5px; }
.fb dt { color: var(--muted); font-weight: 700; }
.fb dd { margin: 0; white-space: pre-line; }

@media (max-width: 480px) {
  .masthead h1 { font-size: 28px; }
  .kpi .value { font-size: 26px; }
}
</style>

<div class="wrap">
  <header class="masthead">
    <span class="label">週次の健康レポート</span>
    <h1>からだ週報</h1>
    <div class="period"><!--@PERIOD--></div>
    <div class="meta"><!--@META--></div>
<!--@NAV-->
  </header>

  <section class="section" aria-labelledby="kpi-h">
    <h2 id="kpi-h">今週の4指標</h2>
    <div class="kpis"><!--@KPIS--></div>
  </section>

  <section class="section" aria-labelledby="trend-h">
    <h2 id="trend-h">週次推移</h2>
    <p class="lead"><!--@TREND_LEAD--></p>
    <div class="charts"><!--@CHARTS--></div>
    <div class="table-wrap"><!--@TREND_TABLE--></div>
  </section>

  <article class="report" aria-label="今週のレポート本文">
<!--@REPORT-->
  </article>

<!--@EXTRA_SECTIONS-->
</div>
<!--@STATE_SCRIPT-->
